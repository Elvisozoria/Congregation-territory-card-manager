name: Notificar asignaciones

# Firebase se queda en plan Spark (sin Cloud Functions), así que el disparador
# es este cron. Repo público ⇒ minutos de Actions gratis e ilimitados.
on:
  schedule:
    # Cada 15 minutos. GitHub suele atrasarlo unos minutos; no importa.
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Mostrar los correos sin enviarlos'
        type: boolean
        default: false

# Dos corridas simultáneas mandarían el mismo correo dos veces.
concurrency:
  group: notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
        working-directory: scripts

      - run: node notify.mjs
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_SES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SES_SECRET_ACCESS_KEY }}
          AWS_SES_REGION: ${{ vars.AWS_SES_REGION || 'us-east-1' }}
          MAIL_FROM: ${{ vars.MAIL_FROM || 'territorios@delonix.io' }}
          APP_URL: ${{ vars.APP_URL }}
          MAIL_DAILY_LIMIT: ${{ vars.MAIL_DAILY_LIMIT || '100' }}
          DRY_RUN: ${{ inputs.dry_run }}
